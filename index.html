<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物冷静箱 · 给心动一点时间</title>
  <style>

  /* 按钮点击反馈动画 */
button {
    transition: transform 0.15s ease;
}

button:active {
    transform: scale(0.96);
}


/* 优化键盘焦点提示 */
button:focus-visible {
    outline: 3px solid #22c55e;
    outline-offset: 3px;
}

    
  :root {
    --ink: #57434e;
    --muted: #7c6872;
    --pink: #b94265;
    --line: #efdae0;
  }

  * {
    box-sizing: border-box;
  }

  /* 保证退出登录后，需要隐藏的区域仍然隐藏 */
  [hidden] {
    display: none !important;
  }

  body {
    margin: 0;
    padding: 48px 20px 72px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    text-align: center;
    background-color: #fff8f2;
    background-image: radial-gradient(#edd9d5 1px, transparent 1px);
    background-size: 22px 22px;
  }

  p {
    line-height: 1.8;
  }

  h2 {
    font-size: 23px;
    letter-spacing: 1px;
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    padding: 12px 20px;
    border: 0;
    border-radius: 14px;
    background: var(--pink);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px #b9426525;
  }

    /* Day 1：修复按钮按压动画 */
button:active:not(:disabled) {
    transform: scale(0.96);
}

  button:disabled {
    opacity: 0.55;
    cursor: wait;
  }

  input,
  textarea {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 13px 15px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: #fffdfb;
    color: var(--ink);
  }

  input:focus,
  textarea:focus {
    outline: 3px solid #f7dce5;
    border-color: var(--pink);
  }

  input::placeholder,
  textarea::placeholder {
    color: #8a747e;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .hero {
    max-width: 800px;
    margin: 0 auto 42px;
  }

  .brand {
    display: inline-block;
    padding: 9px 18px;
    border: 1px solid #ead2d9;
    border-radius: 999px;
    background: #fffdfb;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .hero h1 {
    margin: 23px 0 14px;
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.4;
    color: #704455;
    letter-spacing: 2px;
  }

  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .hero-note {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 16px;
    border-radius: 12px;
    background: #f0e9f7;
    color: #705780;
    font-size: 13px;
  }

  #shopping-area {
    position: relative;
    width: 100%;
    max-width: 960px !important;
    margin: 32px auto !important;
    padding: 32px;
    border: 1px solid #ead8dc;
    border-radius: 28px;
    background: #fffdfb;
    box-shadow: 0 12px 40px #98616f0c;
  }

  #shopping-area::before {
    content: "慢慢挑，也很好 ♡";
    position: absolute;
    top: -15px;
    right: 24px;
    padding: 8px 14px;
    border: 1px solid #ebd59d;
    border-radius: 10px;
    background: #fff0bd;
    color: #795b28;
    font-size: 13px;
    transform: rotate(4deg);
  }

  #shopping-area > h2:first-child::before {
    content: "🛍️ ";
  }

  #shopping-area > p {
    color: var(--muted);
  }

  #shopping-form {
    max-width: 540px;
    margin: 26px auto 32px;
    padding: 22px;
    border: 1px dashed #e9c9d3;
    border-radius: 20px;
    background: #fff6f7;
  }

  #shopping-form label {
    font-size: 14px;
    font-weight: 700;
  }

  #save-item-button {
    margin-top: 6px;
  }

  #shopping-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
    gap: 18px;
    margin-top: 20px;
  }

  #shopping-list article {
    margin: 0 !important;
    padding: 24px !important;
    border: 1px solid #edd9df !important;
    border-radius: 22px !important;
    background: #fff8fa !important;
    box-shadow: 0 5px 0 #f4e5e9;
  }

  #shopping-list article:nth-child(3n + 2) {
    background: #f4f8ef !important;
    border-color: #dce7d1 !important;
    box-shadow: 0 5px 0 #e8efdf;
  }

  #shopping-list article:nth-child(3n) {
    background: #f5f1fb !important;
    border-color: #e4daef !important;
    box-shadow: 0 5px 0 #ebe3f3;
  }

  #shopping-list article h3 {
    margin: 0 0 14px;
    font-size: 20px;
    line-height: 1.5;
  }

  #shopping-list article h3::before {
    content: "✦ ";
    color: var(--pink);
  }

  #shopping-list article p {
    font-size: 14px;
    color: var(--muted);
  }

  #shopping-list article p:first-of-type {
    color: var(--pink);
    font-size: 22px;
    font-weight: 700;
  }

  #shopping-list article p:last-of-type {
    padding: 10px 12px;
    border-radius: 12px;
    background: #ffffffb3;
    color: #654e72;
  }

  #shopping-list article button {
    padding: 9px 13px !important;
    border-radius: 12px;
    font-size: 13px;
  }

  #shopping-list article button:nth-child(2) {
    background: #e3eedb;
    color: #425e38;
  }

  #account-area {
    width: 100%;
    max-width: 480px;
    margin: 36px auto 0 !important;
    padding: 28px;
    border: 1px solid #e4d9ed;
    border-radius: 26px;
    background: #f7f2fc;
    box-shadow: 0 8px 28px #7358850a;
  }

  #account-area hr {
    display: none;
  }

  #account-area h2::before {
    content: "☁️ ";
  }

  #account-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  #account-form p {
    grid-column: 1 / -1;
    margin: 0;
    text-align: left;
  }

  #account-form label {
    font-size: 14px;
    font-weight: 700;
  }

  #account-form input {
    margin-top: 7px;
    background: white;
  }

  #account-form button:last-child {
    background: #e8dff2;
    color: #624c78;
  }

  #account-state,
  #account-message,
  #shopping-message,
  #shopping-list-status {
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  #shopping-message:empty,
  #shopping-list-status:empty,
  #account-message:empty {
    display: none;
  }

  @media (max-width: 600px) {
    body {
      padding: 32px 14px 48px;
    }

    #shopping-area,
    #account-area {
      padding: 24px 18px;
      border-radius: 22px;
    }

    #shopping-form {
      padding: 18px;
    }

    .hero {
      margin-bottom: 32px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    button {
      transition: none;
    }

    button:hover:not(:disabled) {
      transform: none;
    }
  }

#account-form {
  grid-template-columns: 1fr;
}

#account-form #login-button {
  grid-column: 1 / -1;
  width: 100%;
  margin-top: 6px;
  padding: 15px 20px;
  border-radius: 16px;
  background: var(--pink);
  color: white;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 4px;
}

#account-form #register-button {
  grid-column: 1 / -1;
  justify-self: end;
  width: auto;
  margin: 0;
  padding: 6px 0;
  border-radius: 4px;
  background: transparent;
  color: #705780;
  font-size: 13px;
  font-weight: 400;
  box-shadow: none;
}

#account-form #register-button:hover:not(:disabled) {
  background: transparent;
  transform: none;
  box-shadow: none;
  text-decoration: underline;
  text-underline-offset: 4px;
}

#account-form #register-button {
  text-align: right;
  text-decoration: none;
}
</style>
</head>
<body>
<header class="hero">
  <span class="brand">🧸 购物冷静箱</span>

  <h1>
    喜欢可以先收藏，<br>
    决定可以慢慢来。
  </h1>

  <p>收好每一次心动，给自己一点想清楚的时间。</p>

  <span class="hero-note">
    ✨ 登录后，打开属于自己的小箱子
  </span>
</header>
 <section
  id="shopping-area"
  hidden
  style="max-width: 420px; margin: 40px auto; text-align: left;"
>
  <h2>购物冷静箱</h2>
  <p>把想买的东西放进来，三天后再做决定。</p>

  <form id="shopping-form" style="display: grid; gap: 12px;">
    <label for="item-name">想买什么？</label>
    <input
      id="item-name"
      type="text"
      placeholder="例如：降噪耳机"
      maxlength="120"
      required
    >

    <label for="item-price">价格（元）</label>
    <input
      id="item-price"
      type="number"
      placeholder="例如：299"
      min="0"
      max="9999999999.99"
      step="0.01"
      required
    >

    <label for="item-reason">为什么想买？</label>
    <textarea
      id="item-reason"
      placeholder="它能解决什么问题？"
      maxlength="2000"
      rows="3"
    ></textarea>

    <button id="save-item-button" type="submit">
      放进冷静箱
    </button>
  </form>

  <p id="shopping-message" role="status"></p>
<h2>我的冷静箱</h2>
<p id="shopping-list-status" role="status"></p>
<div id="shopping-list"></div>
</section>
<section id="account-area" style="margin-top: 48px;">
  <hr>
  <h2>我的账号</h2>

  <p id="account-state">正在读取登录状态……</p>

  <form id="account-form">
    <p>
      <label for="account-email">邮箱</label><br>
      <input
        id="account-email"
        type="email"
        autocomplete="email"
        required
      >
    </p>

    <p>
      <label for="account-password">密码（至少 8 位）</label><br>
      <input
        id="account-password"
        type="password"
        minlength="8"
        autocomplete="current-password"
        required
      >
    </p>

    <button id="login-button" type="submit">
  登录
</button>

<a id="register-button" href="./register.html">
  没有账号？点击注册
</a>  </form>

  <button id="logout-button" type="button" hidden>退出登录</button>

  <p id="account-message" role="status"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 只需要替换下面两行引号里的内容
  const projectUrl = "https://tnrbpnahznauvlxaufzo.supabase.co";
  const publishableKey = "sb_publishable_cmQ8isqFAxTBDjx2zUzypw_KMkRHU1h";

  const client = window.supabase.createClient(
    projectUrl,
    publishableKey
  );

  const form = document.getElementById("account-form");
  const emailInput = document.getElementById("account-email");
  const passwordInput = document.getElementById("account-password");
  const state = document.getElementById("account-state");
  const message = document.getElementById("account-message");
  const logoutButton = document.getElementById("logout-button");

  // 登录、退出或重新打开网页时，更新界面
  client.auth.onAuthStateChange((event, session) => {
    const loggedIn = Boolean(session);

    form.hidden = loggedIn;
    logoutButton.hidden = !loggedIn;

    state.textContent = loggedIn
      ? "当前登录：" + session.user.email
      : "你还没有登录";
  });

  async function handleAccount(action) {
    const buttons = document.querySelectorAll("#account-area button");
    buttons.forEach(button => button.disabled = true);
    message.textContent = "正在处理，请稍等……";

    try {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (action === "register") {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: "https://waffle980.github.io/my-website/"
          }
        });

        if (error) throw error;

        message.textContent = data.session
          ? "注册成功，已登录。"
          : "注册请求已提交，请到邮箱查收确认邮件。";
      } else if (action === "login") {
        const { error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        message.textContent = "登录成功。";
      } else if (action === "logout") {
        const { error } = await client.auth.signOut();

        if (error) throw error;
        message.textContent = "已退出登录。";
      }

      passwordInput.value = "";
    } catch (error) {
      message.textContent = "操作未完成：" + error.message;
    } finally {
      buttons.forEach(button => button.disabled = false);
    }
  }

 // 点击登录或按回车，都执行登录
form.addEventListener("submit", event => {
  event.preventDefault();
  handleAccount("login");
});


  logoutButton.addEventListener("click", () => {
    handleAccount("logout");
  });
</script>
<script>
  const shoppingArea = document.getElementById("shopping-area");
  const shoppingForm = document.getElementById("shopping-form");
  const shoppingMessage = document.getElementById("shopping-message");
  const saveItemButton = document.getElementById("save-item-button");

  // 只有登录后才显示商品输入框
  client.auth.onAuthStateChange((event, session) => {
    shoppingArea.hidden = !session;

    if (!session) {
      shoppingForm.reset();
      shoppingMessage.textContent = "";
    }
  });

  shoppingForm.addEventListener("submit", async event => {
    event.preventDefault();

    saveItemButton.disabled = true;
    shoppingMessage.textContent = "正在保存……";

    try {
      const name = document.getElementById("item-name").value.trim();
      const price = Number(document.getElementById("item-price").value);
      const reason = document.getElementById("item-reason").value.trim();

      if (!name) {
        throw new Error("请填写商品名称。");
      }

      if (!Number.isFinite(price) || price < 0) {
        throw new Error("请填写有效的价格。");
      }

      // 保存到 Supabase 的商品表
      const { error } = await client
        .from("shopping_items")
        .insert({
          name,
          price,
          reason
        });

      if (error) throw error;

      shoppingForm.reset();
      shoppingMessage.textContent =
        "已放进冷静箱！这件商品的冷静期是三天。";
loadShoppingItems();
    } catch (error) {
      shoppingMessage.textContent = "保存未完成：" + error.message;
    } finally {
      saveItemButton.disabled = false;
    }
  });
</script>
<script>
  const shoppingList = document.getElementById("shopping-list");
  const shoppingListStatus =
    document.getElementById("shopping-list-status");

  let shoppingListUserId = null;
  let shoppingRequest = 0;
  let savedItems = [];

  // 把剩余时间转成容易阅读的文字
  function coolingTimeText(item) {
    if (item.status === "bought") return "已购买";
    if (item.status === "skipped") return "已经不想买了";

    const remaining =
      new Date(item.cooling_until).getTime() - Date.now();

    if (remaining <= 0) {
      return "冷静期已结束，现在还想买吗？";
    }

    const totalMinutes = Math.ceil(remaining / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;

    return `还需冷静：${days}天 ${hours}小时 ${minutes}分钟`;
  }

  // 用文字安全地填充卡片
  function addShoppingText(card, tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    element.style.whiteSpace = "pre-wrap";
    card.appendChild(element);
  }

  function renderShoppingItems() {
    shoppingList.replaceChildren();

    if (savedItems.length === 0) {
      shoppingList.textContent = "冷静箱还是空的，添加第一件商品吧。";
      return;
    }

    savedItems.forEach(item => {
      const card = document.createElement("article");

      card.style.cssText =
        "margin:16px 0;padding:20px;background:white;" +
        "border:1px solid #dbe2ea;border-radius:16px;" +
        "overflow-wrap:anywhere;";

      addShoppingText(card, "h3", item.name);
      addShoppingText(
        card,
        "p",
        "价格：¥" + Number(item.price).toLocaleString("zh-CN", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
})
      );
      addShoppingText(
        card,
        "p",
        "想买的理由：" + (item.reason || "还没填写")
      );
      addShoppingText(card, "p", coolingTimeText(item));

// 尚未做决定的商品显示两个按钮
if (item.status === "cooling") {
  const actions = document.createElement("div");

  const choices = [
    { text: "已购买", status: "bought" },
    { text: "不想买了", status: "skipped" }
  ];

  choices.forEach(choice => {
    const button = document.createElement("button");

    button.type = "button";
    button.textContent = choice.text;
    button.style.cssText = "margin:4px 8px 4px 0;padding:8px 12px;";
    button.disabled = pendingShoppingItems.has(item.id);

    button.addEventListener("click", () => {
      updateShoppingStatus(item.id, choice.status);
    });

    actions.appendChild(button);
  });

  card.appendChild(actions);
}

shoppingList.appendChild(card);
    });
  }
// 记录正在保存的商品，防止重复点击
const pendingShoppingItems = new Set();

async function updateShoppingStatus(itemId, nextStatus) {
  const owner = shoppingListUserId;

  if (!owner || pendingShoppingItems.has(itemId)) return;
  if (!["bought", "skipped"].includes(nextStatus)) return;

  pendingShoppingItems.add(itemId);
  renderShoppingItems();
  shoppingListStatus.textContent = "正在保存你的决定……";

  try {
    const { data, error } = await client
      .from("shopping_items")
      .update({ status: nextStatus })
      .eq("id", itemId)
      .eq("user_id", owner)
      .eq("status", "cooling")
      .select("id, status");

    // 保存期间若已切换账号，不改动当前界面
    if (owner !== shoppingListUserId) return;

    if (error) throw error;

    if (!data || data.length !== 1) {
      throw new Error("这条商品记录可能已经变化，请刷新网页后重试。");
    }

    // 数据库确认保存后，再更新卡片
    savedItems = savedItems.map(item => {
      if (item.id === itemId) {
        return { ...item, status: data[0].status };
      }

      return item;
    });

    shoppingListStatus.textContent =
      nextStatus === "bought"
        ? "已记录：这件商品买下来了。"
        : "已记录：这件商品已经不想买了。";
  } catch (error) {
    if (owner === shoppingListUserId) {
      shoppingListStatus.textContent =
        "保存未完成：" + error.message;
    }
  } finally {
    pendingShoppingItems.delete(itemId);

    if (owner === shoppingListUserId) {
      renderShoppingItems();
    }
  }
}
  // 从数据库读取当前账号的商品
  async function loadShoppingItems() {
    const owner = shoppingListUserId;
    if (!owner) return;

    const request = ++shoppingRequest;
    shoppingListStatus.textContent = "正在读取商品……";

    try {
      const { data, error } = await client
        .from("shopping_items")
        .select("id, name, price, reason, cooling_until, status")
        .eq("user_id", owner)
        .order("created_at", { ascending: false });

      // 读取期间若已退出或切换账号，丢弃旧结果
      if (request !== shoppingRequest) return;
      if (error) throw error;

      savedItems = data;
      renderShoppingItems();
      shoppingListStatus.textContent = "";
    } catch (error) {
      if (request !== shoppingRequest) return;

      shoppingListStatus.textContent =
        "读取未完成：" + error.message;
    }
  }

  // 登录后读取；退出或切换账号时清空旧内容
  client.auth.onAuthStateChange((event, session) => {
    const nextUserId = session ? session.user.id : null;
    if (nextUserId === shoppingListUserId) return;

    shoppingListUserId = nextUserId;
    shoppingRequest++;
    savedItems = [];
    shoppingList.replaceChildren();
    shoppingListStatus.textContent = "";

    if (nextUserId) {
      setTimeout(() => loadShoppingItems(), 0);
    }
  });

  // 每分钟更新一次卡片上的剩余时间
  setInterval(() => {
    if (shoppingListUserId) {
      renderShoppingItems();
    }
  }, 60000);
</script>

</html>
