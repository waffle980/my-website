<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物冷静箱</title>
  <style>
    body {
      margin: 0;
      padding: 80px 24px;
      font-family: "Microsoft YaHei", sans-serif;
      text-align: center;
      background: #f3f6fc;
      color: #1e293b;
    }

    h1 {
      color: #2563eb;
    }

    p {
      line-height: 1.8;
    }
  </style>
</head>
<body>
 <section
  id="shopping-area"
  hidden
  style="max-width: 420px; margin: 40px auto; text-align: left;"
>
  <h2>购物冷静箱</h2>
  <p>把想买的东西放进来，三天后再做决定。</p>

  <form id="shopping-form" style="display: grid; gap: 12px;">
    <label for="item-name">想买什么？</label>
    <input
      id="item-name"
      type="text"
      placeholder="例如：降噪耳机"
      maxlength="120"
      required
    >

    <label for="item-price">价格（元）</label>
    <input
      id="item-price"
      type="number"
      placeholder="例如：299"
      min="0"
      max="9999999999.99"
      step="0.01"
      required
    >

    <label for="item-reason">为什么想买？</label>
    <textarea
      id="item-reason"
      placeholder="它能解决什么问题？"
      maxlength="2000"
      rows="3"
    ></textarea>

    <button id="save-item-button" type="submit">
      放进冷静箱
    </button>
  </form>

  <p id="shopping-message" role="status"></p>
<h2>我的冷静箱</h2>
<p id="shopping-list-status" role="status"></p>
<div id="shopping-list"></div>
</section>
<section id="account-area" style="margin-top: 48px;">
  <hr>
  <h2>我的账号</h2>

  <p id="account-state">正在读取登录状态……</p>

  <form id="account-form">
    <p>
      <label for="account-email">邮箱</label><br>
      <input
        id="account-email"
        type="email"
        autocomplete="email"
        required
      >
    </p>

    <p>
      <label for="account-password">密码（至少 8 位）</label><br>
      <input
        id="account-password"
        type="password"
        minlength="8"
        autocomplete="current-password"
        required
      >
    </p>

    <button type="submit" value="register">注册</button>
    <button type="submit" value="login">登录</button>
  </form>

  <button id="logout-button" type="button" hidden>退出登录</button>

  <p id="account-message" role="status"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 只需要替换下面两行引号里的内容
  const projectUrl = "https://tnrbpnahznauvlxaufzo.supabase.co";
  const publishableKey = "sb_publishable_cmQ8isqFAxTBDjx2zUzypw_KMkRHU1h";

  const client = window.supabase.createClient(
    projectUrl,
    publishableKey
  );

  const form = document.getElementById("account-form");
  const emailInput = document.getElementById("account-email");
  const passwordInput = document.getElementById("account-password");
  const state = document.getElementById("account-state");
  const message = document.getElementById("account-message");
  const logoutButton = document.getElementById("logout-button");

  // 登录、退出或重新打开网页时，更新界面
  client.auth.onAuthStateChange((event, session) => {
    const loggedIn = Boolean(session);

    form.hidden = loggedIn;
    logoutButton.hidden = !loggedIn;

    state.textContent = loggedIn
      ? "当前登录：" + session.user.email
      : "你还没有登录";
  });

  async function handleAccount(action) {
    const buttons = document.querySelectorAll("#account-area button");
    buttons.forEach(button => button.disabled = true);
    message.textContent = "正在处理，请稍等……";

    try {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (action === "register") {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: "https://waffle980.github.io/my-website/"
          }
        });

        if (error) throw error;

        message.textContent = data.session
          ? "注册成功，已登录。"
          : "注册请求已提交，请到邮箱查收确认邮件。";
      } else if (action === "login") {
        const { error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        message.textContent = "登录成功。";
      } else if (action === "logout") {
        const { error } = await client.auth.signOut();

        if (error) throw error;
        message.textContent = "已退出登录。";
      }

      passwordInput.value = "";
    } catch (error) {
      message.textContent = "操作未完成：" + error.message;
    } finally {
      buttons.forEach(button => button.disabled = false);
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    handleAccount(event.submitter.value);
  });

  logoutButton.addEventListener("click", () => {
    handleAccount("logout");
  });
</script>
<script>
  const shoppingArea = document.getElementById("shopping-area");
  const shoppingForm = document.getElementById("shopping-form");
  const shoppingMessage = document.getElementById("shopping-message");
  const saveItemButton = document.getElementById("save-item-button");

  // 只有登录后才显示商品输入框
  client.auth.onAuthStateChange((event, session) => {
    shoppingArea.hidden = !session;

    if (!session) {
      shoppingForm.reset();
      shoppingMessage.textContent = "";
    }
  });

  shoppingForm.addEventListener("submit", async event => {
    event.preventDefault();

    saveItemButton.disabled = true;
    shoppingMessage.textContent = "正在保存……";

    try {
      const name = document.getElementById("item-name").value.trim();
      const price = Number(document.getElementById("item-price").value);
      const reason = document.getElementById("item-reason").value.trim();

      if (!name) {
        throw new Error("请填写商品名称。");
      }

      if (!Number.isFinite(price) || price < 0) {
        throw new Error("请填写有效的价格。");
      }

      // 保存到 Supabase 的商品表
      const { error } = await client
        .from("shopping_items")
        .insert({
          name,
          price,
          reason
        });

      if (error) throw error;

      shoppingForm.reset();
      shoppingMessage.textContent =
        "已放进冷静箱！这件商品的冷静期是三天。";
loadShoppingItems();
    } catch (error) {
      shoppingMessage.textContent = "保存未完成：" + error.message;
    } finally {
      saveItemButton.disabled = false;
    }
  });
</script>
<script>
  const shoppingList = document.getElementById("shopping-list");
  const shoppingListStatus =
    document.getElementById("shopping-list-status");

  let shoppingListUserId = null;
  let shoppingRequest = 0;
  let savedItems = [];

  // 把剩余时间转成容易阅读的文字
  function coolingTimeText(item) {
    if (item.status === "bought") return "已购买";
    if (item.status === "skipped") return "已经不想买了";

    const remaining =
      new Date(item.cooling_until).getTime() - Date.now();

    if (remaining <= 0) {
      return "冷静期已结束，现在还想买吗？";
    }

    const totalMinutes = Math.ceil(remaining / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;

    return `还需冷静：${days}天 ${hours}小时 ${minutes}分钟`;
  }

  // 用文字安全地填充卡片
  function addShoppingText(card, tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    element.style.whiteSpace = "pre-wrap";
    card.appendChild(element);
  }

  function renderShoppingItems() {
    shoppingList.replaceChildren();

    if (savedItems.length === 0) {
      shoppingList.textContent = "冷静箱还是空的，添加第一件商品吧。";
      return;
    }

    savedItems.forEach(item => {
      const card = document.createElement("article");

      card.style.cssText =
        "margin:16px 0;padding:20px;background:white;" +
        "border:1px solid #dbe2ea;border-radius:16px;" +
        "overflow-wrap:anywhere;";

      addShoppingText(card, "h3", item.name);
      addShoppingText(
        card,
        "p",
        "价格：¥" + Number(item.price).toFixed(2)
      );
      addShoppingText(
        card,
        "p",
        "想买的理由：" + (item.reason || "还没填写")
      );
      addShoppingText(card, "p", coolingTimeText(item));

      shoppingList.appendChild(card);
    });
  }

  // 从数据库读取当前账号的商品
  async function loadShoppingItems() {
    const owner = shoppingListUserId;
    if (!owner) return;

    const request = ++shoppingRequest;
    shoppingListStatus.textContent = "正在读取商品……";

    try {
      const { data, error } = await client
        .from("shopping_items")
        .select("id, name, price, reason, cooling_until, status")
        .eq("user_id", owner)
        .order("created_at", { ascending: false });

      // 读取期间若已退出或切换账号，丢弃旧结果
      if (request !== shoppingRequest) return;
      if (error) throw error;

      savedItems = data;
      renderShoppingItems();
      shoppingListStatus.textContent = "";
    } catch (error) {
      if (request !== shoppingRequest) return;

      shoppingListStatus.textContent =
        "读取未完成：" + error.message;
    }
  }

  // 登录后读取；退出或切换账号时清空旧内容
  client.auth.onAuthStateChange((event, session) => {
    const nextUserId = session ? session.user.id : null;
    if (nextUserId === shoppingListUserId) return;

    shoppingListUserId = nextUserId;
    shoppingRequest++;
    savedItems = [];
    shoppingList.replaceChildren();
    shoppingListStatus.textContent = "";

    if (nextUserId) {
      setTimeout(() => loadShoppingItems(), 0);
    }
  });

  // 每分钟更新一次卡片上的剩余时间
  setInterval(() => {
    if (shoppingListUserId) {
      renderShoppingItems();
    }
  }, 60000);
</script>
</body>
</html>
